[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vrtc-sdk"
version = "0.1.0"
description = "Official Python client for the VRTc Research & Retrieval API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "VRTc Team" }]

[tool.setuptools.packages.find]
where = ["src"]
