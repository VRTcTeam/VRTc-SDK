[workspace]
resolver = "2"
members = [
    "crates/vrtc-core",
    "crates/vrtc-registry",
    "crates/vrtc-search",
    "crates/vrtc-frontier",
    "crates/vrtc-fetcher",
    "crates/vrtc-extract",
    "crates/vrtc-index",
    "crates/vrtc-retrieval",
    "crates/vrtc-feedback",
    "crates/vrtc-crawler",
    "crates/vrtc-delta",
    "crates/vrtc-evidence",
    "crates/vrtc-storage",
    "crates/vrtc-queue",
    "crates/vrtc-observability",
    "crates/vrtc-runtime",
    "crates/vrtc-api",
    "crates/vrtc-provider-geekflare",
]

[workspace.package]
edition = "2021"
license = "AGPL-3.0-or-later"
rust-version = "1.88"

[workspace.dependencies]
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tantivy = "=0.27.0"
serde_json = "1"
axum = { version = "0.7", features = ["json"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1.40", features = ["macros", "rt-multi-thread", "sync", "time", "net"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
