[workspace]
resolver = "2"
members = [
    "crates/vrtc-core",
    "crates/vrtc-registry",
    "crates/vrtc-search",
]

[workspace.package]
edition = "2021"
license = "AGPL-3.0-or-later"
rust-version = "1.80"

[workspace.dependencies]
async-trait = "0.1"
tokio = { version = "1.40", features = ["macros", "rt-multi-thread", "sync", "time"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
