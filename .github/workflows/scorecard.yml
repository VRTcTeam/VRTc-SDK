name: OpenSSF Scorecard

on:
  push:
    branches: [main]
  branch_protection_rule:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scorecard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard supply-chain assessment
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Run Scorecard CLI from the official GHCR image
        env:
          GITHUB_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          docker run --rm \
            -e GITHUB_AUTH_TOKEN \
            ghcr.io/ossf/scorecard:v5.6.0 \
            --repo=github.com/VRTcTeam/VRTc-SDK \
            --format=json > scorecard-results.json

      - name: Upload Scorecard report
        uses: actions/upload-artifact@v4
        with:
          name: openssf-scorecard-report
          path: scorecard-results.json
          if-no-files-found: error
          retention-days: 14
