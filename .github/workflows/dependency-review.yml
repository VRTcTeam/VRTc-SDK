name: Dependency Review

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  dependency-review:
    name: Dependency review (Dependency Graph prerequisite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Review dependency changes
        id: dependency_review
        uses: actions/dependency-review-action@v4
        continue-on-error: true
        with:
          fail-on-severity: high

      - name: Explain GitHub prerequisite
        if: ${{ steps.dependency_review.outcome == 'failure' }}
        run: echo "Dependency Review is currently non-blocking until GitHub Dependency Graph is enabled in repository Security settings."
