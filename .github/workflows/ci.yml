name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-check:
    name: Repository and specification checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify project structure and specifications
        shell: bash
        run: |
          set -euo pipefail
          test -s README.md
          grep -q "VRTc" README.md
          test -s docs/specifications/m1-core-contracts-and-registry.md
          grep -q "EngineDescriptor" docs/specifications/m1-core-contracts-and-registry.md
          grep -q "ProviderDescriptor" docs/specifications/m1-core-contracts-and-registry.md
          test -s crates/vrtc-core/src/lib.rs
          test -s crates/vrtc-registry/src/lib.rs
          test -s crates/vrtc-search/src/lib.rs
          test -s crates/vrtc-api/src/lib.rs
          test -s docs/specifications/m3-search-engine.md
          test -s docs/specifications/m4-http-api.md

      - name: Check committed whitespace
        run: git diff-tree --check HEAD

  rust-workspace:
    name: Rust workspace
    runs-on: ubuntu-latest
    steps:
      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-features
