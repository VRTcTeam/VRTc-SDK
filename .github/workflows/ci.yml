name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-check:
    name: Repository and specification checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify project structure and specifications
        shell: bash
        run: |
          set -euo pipefail
          test -s README.md
          grep -q "VRTc" README.md
          test -s docs/specifications/m1-core-contracts-and-registry.md
          test -s docs/specifications/m2-runtime-integration.md
          grep -q "EngineDescriptor" docs/specifications/m1-core-contracts-and-registry.md
          grep -q "ProviderDescriptor" docs/specifications/m1-core-contracts-and-registry.md
          test -s crates/vrtc-core/src/lib.rs
          test -s crates/vrtc-registry/src/lib.rs
          test -s crates/vrtc-search/src/lib.rs
          test -s crates/vrtc-frontier/src/lib.rs
          test -s crates/vrtc-fetcher/src/lib.rs
          test -s crates/vrtc-extract/src/lib.rs
          test -s crates/vrtc-index/src/lib.rs
          test -s crates/vrtc-retrieval/src/lib.rs
          test -s crates/vrtc-feedback/src/lib.rs
          test -s crates/vrtc-crawler/src/lib.rs
          test -s crates/vrtc-runtime/src/lib.rs
          test -s crates/vrtc-api/src/lib.rs
          test -s crates/vrtc-provider-geekflare/src/lib.rs
          test -s docs/specifications/geekflare-search-provider.md
          test -s docs/specifications/m3-search-engine.md
          test -s docs/specifications/m4-http-api.md
          test -s docs/specifications/m7-native-http-fetcher.md
          test -s docs/specifications/m8-native-html-extraction.md
          test -s docs/specifications/m9-native-document-index.md
          test -s docs/specifications/m10-native-hybrid-retrieval.md
          test -s docs/specifications/m11-native-human-feedback.md
          test -s docs/specifications/m12-native-metasearch.md
          test -s docs/specifications/m13-native-crawler-orchestration.md
          test -s sdks/typescript/src/index.ts
          test -s sdks/python/src/vrtc_sdk/client.py

      - name: Check committed whitespace
        run: git diff-tree --check HEAD

  rust-workspace:
    name: Rust workspace
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-features

  typescript-sdk:
    name: TypeScript SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/typescript
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Type-check SDK
        run: npm run typecheck

  python-sdk:
    name: Python SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/python
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SDK package
        run: python -m pip install --no-deps -e .

      - name: Compile package
        run: python -m compileall -q src

      - name: Run SDK unit tests
        run: python -m unittest discover -s tests -v
